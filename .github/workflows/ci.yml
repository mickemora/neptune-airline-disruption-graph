name: ci

on:
  push:
  pull_request:

jobs:
  test-and-synth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4          # local Spark for the lakehouse tests
        with:
          distribution: temurin
          java-version: "17"
      - name: Install
        run: |
          pip install -r requirements-dev.txt
          npm install -g aws-cdk
      - name: Unit tests
        run: pytest -q
      - name: Agent SDK, UI and lakehouse tests must run, not skip
        run: |
          pytest -q -rs tests/test_agent.py tests/test_agentcore.py tests/test_ui.py \
            tests/test_lakehouse.py tests/test_ontology.py tests/test_bundle.py | tee /tmp/must-run.txt
          ! grep -q SKIP /tmp/must-run.txt
      - name: CDK synth (environment-agnostic, no AWS credentials needed)
        run: cdk synth --quiet
      - name: AgentCore code package is complete (Linux arm64)
        run: |
          python - <<'PY'
          import zipfile
          z = zipfile.ZipFile("build/agent_runtime.zip")
          names = z.namelist()
          for required in ("main.py", "agent/prompt.py", "agent/turns.py"):
              assert required in names, required
          for pkg in ("strands/", "bedrock_agentcore/", "mcp_proxy_for_aws/", "mcp/"):
              assert any(n.startswith(pkg) for n in names), pkg
          arm = [n for n in names if n.endswith(".so") and "aarch64" in n]
          x86 = [n for n in names if n.endswith(".so") and "x86_64" in n]
          assert arm and not x86, (len(arm), x86[:3])
          print(len(names), "files, arm64 native libs:", len(arm))
          PY
