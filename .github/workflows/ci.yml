name: ci

on:
  push:
  pull_request:

jobs:
  test-and-synth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: |
          pip install -r requirements-dev.txt
          npm install -g aws-cdk
      - name: Unit tests
        run: pytest -q
      - name: CDK synth (environment-agnostic, no AWS credentials needed)
        run: cdk synth --quiet
